name: 单独编译内核模块 (提取 ADSP 等)

env:
  TZ: Asia/Shanghai
  KERNEL_VERSION: '6.6'

on:
  workflow_dispatch:

jobs:
  build_modules:
    runs-on: ubuntu-latest
    steps:
      - name: 安装环境依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils python-is-python3 libssl-dev libelf-dev aria2 zip unzip

      - name: 克隆源码与工具链
        run: |
          mkdir kernel_workspace
          cd kernel_workspace
          
          echo "正在克隆源码..."
          aria2c -s16 -x16 -k1M https://github.com/cctv18/android_kernel_common_oneplus_sm8750/archive/refs/heads/oneplus/sm8750_v_15.0.2_oneplus_13_6.6.66.zip -o common.zip
          unzip -q common.zip
          mv "android_kernel_common_oneplus_sm8750-oneplus-sm8750_v_15.0.2_oneplus_13_6.6.66" common
          
          echo "正在克隆 clang 工具链..."
          mkdir -p clang18
          aria2c -s16 -x16 -k1M https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang18-r510928/clang-r510928.zip -o clang.zip
          unzip -q clang.zip -d clang18
          
          echo "正在克隆构建工具..."
          aria2c -s16 -x16 -k1M https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang18-r510928/build-tools.zip -o build-tools.zip
          unzip -q build-tools.zip

      - name: 编译内核并提取模块
        run: |
          WORKDIR="$(pwd)"
          export PATH="$WORKDIR/kernel_workspace/clang18/bin:$PATH"
          export PATH="$WORKDIR/kernel_workspace/build-tools/bin:$PATH"
          
          cd kernel_workspace/common
          
          echo "1. 生成默认配置..."
          make -j$(nproc --all) LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC="clang" LD="ld.lld" HOSTLD=ld.lld O=out KCFLAGS+=-O2 KCFLAGS+=-Wno-error gki_defconfig
          
          echo "2. 编译 Image (这一步是为了生成 Module.symvers 符号表)..."
          make -j$(nproc --all) LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC="clang" LD="ld.lld" HOSTLD=ld.lld O=out KCFLAGS+=-O2 KCFLAGS+=-Wno-error Image
          
          echo "3. 独立编译 ADSP 模块 (drivers/remoteproc)..."
          make -j$(nproc --all) LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC="clang" LD="ld.lld" HOSTLD=ld.lld O=out M=drivers/remoteproc KCFLAGS+=-O2 KCFLAGS+=-Wno-error modules

      - name: 收集并打包 .ko 文件
        run: |
          cd kernel_workspace
          mkdir -p ko_output
          
          echo "提取 ADSP 相关的所有 .ko 文件..."
          find common/out/drivers/remoteproc -name "*.ko" -exec cp {} ko_output/ \;
          
          echo "当前提取到的模块列表："
          ls -la ko_output/
          
          cd ko_output
          zip -r ../compiled_modules.zip .

      - name: 上传编译好的模块
        uses: actions/upload-artifact@v4
        with:
          name: compiled-modules
          path: kernel_workspace/compiled_modules.zip
          archive: false